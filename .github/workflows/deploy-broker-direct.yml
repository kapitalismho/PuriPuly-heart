name: Deploy Broker Direct

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Type `deploy puripuly-heart-broker from dev` to confirm the canonical production deploy.
        required: true
        type: string
      apply_migrations:
        description: Apply ordinary migrations to an already initialized supported database before deploying code.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-broker-direct-production
  cancel-in-progress: false

jobs:
  deploy-direct:
    name: Direct deploy canonical broker worker
    runs-on: ubuntu-latest
    environment: production
    env:
      NODE_VERSION: '22.23.4'
      BROKER_CANONICAL_WORKERS_DEV_URL: ${{ vars.BROKER_CANONICAL_WORKERS_DEV_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BROKER_D1_DATABASE_ID_PRODUCTION: ${{ secrets.BROKER_D1_DATABASE_ID_PRODUCTION }}
      NETWORK_IDENTITY_HMAC_KEY_VERSION_PRODUCTION: ${{ vars.NETWORK_IDENTITY_HMAC_KEY_VERSION_PRODUCTION }}
      NETWORK_IDENTITY_HMAC_KEY_VERSION_PREVIOUS_PRODUCTION: ${{ vars.NETWORK_IDENTITY_HMAC_KEY_VERSION_PREVIOUS_PRODUCTION }}
      APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
    steps:
      - name: Guard production deploy ref and configuration
        shell: bash
        env:
          CONFIRM_PRODUCTION_DEPLOY: ${{ inputs.confirm_production_deploy }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/dev' ]]; then
            echo 'Direct production broker deploys must be launched from refs/heads/dev.' >&2
            exit 1
          fi
          if [[ "$CONFIRM_PRODUCTION_DEPLOY" != 'deploy puripuly-heart-broker from dev' ]]; then
            echo 'confirm_production_deploy must exactly match: deploy puripuly-heart-broker from dev' >&2
            exit 1
          fi
          case "$APPLY_MIGRATIONS" in
            ''|'false'|'true') ;;
            *) echo 'apply_migrations must be false or true.' >&2; exit 1 ;;
          esac
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BROKER_D1_DATABASE_ID_PRODUCTION; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "$name is required and must not be blank." >&2
              exit 1
            fi
          done
          if [[ ! "$BROKER_CANONICAL_WORKERS_DEV_URL" =~ ^https://puripuly-heart-broker\.[a-z0-9-]+\.workers\.dev/?$ ]]; then
            echo 'BROKER_CANONICAL_WORKERS_DEV_URL must target the canonical puripuly-heart-broker workers.dev hostname.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Render production Wrangler config
        shell: bash
        working-directory: broker
        run: |
          version_args=(--network-identity-hmac-key-version "$NETWORK_IDENTITY_HMAC_KEY_VERSION_PRODUCTION")
          if [[ -n "${NETWORK_IDENTITY_HMAC_KEY_VERSION_PREVIOUS_PRODUCTION//[[:space:]]/}" ]]; then
            version_args+=(--network-identity-hmac-key-version-previous "$NETWORK_IDENTITY_HMAC_KEY_VERSION_PREVIOUS_PRODUCTION")
          fi
          node scripts/render-production-wrangler-config.mjs \
            --database-id "$BROKER_D1_DATABASE_ID_PRODUCTION" \
            "${version_args[@]}" --out wrangler.production.jsonc

      - name: Validate production Wrangler config
        working-directory: broker
        run: pnpm exec wrangler types --config wrangler.production.jsonc

      - name: Require initialized supported Broker database
        shell: bash
        working-directory: broker
        run: |
          journal_json="$(pnpm exec wrangler d1 execute \
            puripuly-heart-broker --remote --config wrangler.production.jsonc \
            --command "SELECT name FROM d1_migrations;" --json)"
          readiness_json="$(pnpm exec wrangler d1 execute \
            puripuly-heart-broker --remote --config wrangler.production.jsonc \
            --command "SELECT key, value FROM broker_config WHERE key IN ('fingerprint_salt', 'network_identity_migration') UNION ALL SELECT 'legacy_column', name FROM pragma_table_info('broker_request_events') WHERE name = 'ip' UNION ALL SELECT 'legacy_column', name FROM pragma_table_info('broker_issue_success_events') WHERE name IN ('ip_hash', 'ip_prefix_hash') UNION ALL SELECT 'legacy_column', name FROM pragma_table_info('referral_rewards') WHERE name = 'attempt_ip_hash';" --json)"
          python3 - "$journal_json" "$readiness_json" <<'PY'
          import json
          import sys

          def rows(raw):
              payload = json.loads(raw)
              if len(payload) != 1 or payload[0].get('success') is not True:
                  raise SystemExit('Broker readiness query did not succeed.')
              return payload[0]['results']

          applied = {row['name'] for row in rows(sys.argv[1])}
          required = {
              '0021_network_identity_purge.sql',
              '0022_managed_operation_issuance_context.sql',
              '0023_backfill_operation_route_rate_limits.sql',
              '0024_allow_unattributed_request_events.sql',
          }
          if not required <= applied:
              raise SystemExit('Unsupported Broker migration history; complete privacy maintenance before deployment.')
          state = rows(sys.argv[2])
          if any(row['key'] == 'legacy_column' for row in state):
              raise SystemExit('Unsupported legacy network identity columns remain.')
          config = {row['key']: json.loads(row['value']) for row in state}
          fingerprint = config.get('fingerprint_salt', {}).get('current', {})
          salt = fingerprint.get('salt')
          version = fingerprint.get('version')
          if not isinstance(salt, str) or not salt.strip() or salt == '__BOOTSTRAP_REQUIRED__' or type(version) is not int or version <= 0:
              raise SystemExit('Broker fingerprint salt must already be initialized.')
          if config.get('network_identity_migration', {}).get('phase') != 'keyed_only':
              raise SystemExit('Broker privacy transition must already be keyed_only.')
          PY

      - name: Stage and apply explicitly selected ordinary migrations
        if: inputs.apply_migrations
        shell: bash
        working-directory: broker
        run: |
          stage='.deploy-direct/migrations'
          mkdir -p "$stage"
          for migration in migrations/*.sql; do
            case "$(basename "$migration")" in
              0025_drop_legacy_translation_telemetry.sql|0027_remove_managed_referrals.sql) continue ;;
            esac
            cp "$migration" "$stage/"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path

          config = Path('wrangler.production.jsonc').read_text(encoding='utf-8')
          config, count = re.subn(
              r'("database_id"\s*:\s*"[^"]+")',
              r'\1, "migrations_dir": "migrations"',
              config,
              count=1,
          )
          if count != 1:
              raise SystemExit('Production database_id was not found.')
          Path('.deploy-direct/wrangler.migrations.jsonc').write_text(config, encoding='utf-8')
          PY
          pnpm exec wrangler d1 migrations apply puripuly-heart-broker \
            --remote --config .deploy-direct/wrangler.migrations.jsonc

      - name: Require deploy-ready ordinary schema
        shell: bash
        working-directory: broker
        run: |
          schema_json="$(pnpm exec wrangler d1 execute \
            puripuly-heart-broker --remote --config wrangler.production.jsonc \
            --command "SELECT 'migration' AS kind, name FROM d1_migrations UNION ALL SELECT 'column', name FROM pragma_table_info('managed_operation_attempts');" --json)"
          python3 - "$schema_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(sys.argv[1])
          if len(payload) != 1 or payload[0].get('success') is not True:
              raise SystemExit('Broker ordinary-schema query did not succeed.')
          rows = payload[0]['results']
          held = {'0025_drop_legacy_translation_telemetry.sql', '0027_remove_managed_referrals.sql'}
          required = {path.name for path in Path('migrations').glob('*.sql')} - held
          applied = {row['name'] for row in rows if row['kind'] == 'migration'}
          if not required <= applied:
              raise SystemExit('Required ordinary migrations are pending; explicitly select apply_migrations or complete maintenance manually.')
          columns = {row['name'] for row in rows if row['kind'] == 'column'}
          if not {
              'cleanup_token', 'cleanup_started_at', 'scan_offset',
              'create_in_flight', 'legacy_cleanup_state', 'legacy_cleanup_checked_at',
          } <= columns:
              raise SystemExit('Required managed-attempt cleanup schema is missing despite migration history.')
          PY


      - name: Deploy canonical broker worker
        working-directory: broker
        run: pnpm exec wrangler deploy --keep-vars --config wrangler.production.jsonc

      - name: Verify deployed health and public foundation
        shell: bash
        timeout-minutes: 5
        run: |
          probe_dir="$(mktemp -d)"
          trap 'rm -rf -- "$probe_dir"' EXIT
          for attempt in {1..12}; do
            health_status=0
            foundation_status=0
            health_status="$(curl --silent --show-error --max-time 10 \
              --output "$probe_dir/health.json" --write-out '%{http_code}' \
              "${BROKER_CANONICAL_WORKERS_DEV_URL%/}/healthz")" || health_status=0
            foundation_status="$(curl --silent --show-error --max-time 10 \
              --output "$probe_dir/foundation.json" --write-out '%{http_code}' \
              "${BROKER_CANONICAL_WORKERS_DEV_URL%/}/v1/foundation")" || foundation_status=0
            if [[ "$health_status" == '200' && "$foundation_status" == '200' ]] && python3 - "$probe_dir" <<'PY'
          import ast
          import json
          import re
          import sys
          from pathlib import Path

          try:
              root = Path(sys.argv[1])
              health = json.loads((root / 'health.json').read_text(encoding='utf-8'))
              foundation = json.loads((root / 'foundation.json').read_text(encoding='utf-8'))
              assert health['ok'] is True
              assert health['service'] == foundation['service'] == 'puripuly-heart-broker'
              assert foundation['runtime']['runtime'] == 'Cloudflare Workers'
              assert foundation['runtime']['database'] == 'Cloudflare D1'
              assert foundation['bindings']['d1'] == 'BROKER_DB'
              assert foundation['serviceBoundary'] == {
                  'role': 'trial-credential-broker',
                  'proxiesTranslationText': False,
                  'inferencePath': 'app-direct-to-openrouter',
              }
              trial = foundation['trialProviderPolicy']['managedFreeTrial']
              assert trial['provider'] == 'OpenRouter'
              expected_models = ast.literal_eval(re.search(
                  r'export const MANAGED_TRIAL_ALLOWED_MODELS = (\[.*?\]) as const;',
                  Path('broker/src/trial-policy.ts').read_text(encoding='utf-8'),
                  re.S,
              ).group(1))
              assert isinstance(trial['models'], list) and set(trial['models']) == set(expected_models)
          except (AssertionError, KeyError, TypeError, ValueError):
              raise SystemExit('Deployed Broker public contract did not match.')
          PY
            then
              echo 'Deployed Broker health and public foundation verified.'
              exit 0
            fi
            if [[ "$attempt" != '12' ]]; then sleep 5; fi
          done
          echo 'Timed out verifying deployed Broker health and public foundation.' >&2
          exit 1
