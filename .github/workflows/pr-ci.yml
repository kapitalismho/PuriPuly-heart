name: PR CI

on:
  pull_request:
    branches:
      - dev
      - release

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.10"
  UV_VERSION: "0.13.5"
  NODE_VERSION: "22.23.4"

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-style:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup UV environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-args: --extra dev
          lock-mode: locked

      - name: Ruff check
        run: uv run --locked ruff check .

      - name: Cache Black results
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/black-cache
          key: black-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            black-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      - name: Black check
        env:
          BLACK_CACHE_DIR: ${{ runner.temp }}/black-cache
        run: uv run --locked black --check .

      - name: Check Python test selection
        run: uv run --locked python scripts/ci/check_test_selection.py

  python-contracts:
    name: Contracts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup UV environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-args: --extra dev
          lock-mode: locked

      - name: Run contract tests
        run: uv run --locked pytest -ra --numprocesses=2 --dist=loadfile --max-worker-restart=0 --capture=fd --junitxml=contract-results.xml tests/domain tests/config tests/core

      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contracts-results
          path: contract-results.xml

  python-suite:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Architecture
            pytest-args: tests/architecture
          - name: Runtime
            pytest-args: --numprocesses=2 --dist=loadfile --max-worker-restart=0 --capture=fd tests/app
          - name: Providers
            pytest-args: tests/providers
          - name: UI
            pytest-args: tests/ui
          - name: Tooling
            pytest-args: tests/scripts tests/cli tests/release_evidence
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup UV environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-args: --extra dev
          lock-mode: locked

      - name: Run tests
        run: uv run --locked pytest -ra --junitxml=python-results.xml ${{ matrix.pytest-args }}

      - name: Upload Python results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-${{ matrix.name }}-results
          path: python-results.xml

  broker-ci:
    name: Broker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run broker tests
        run: pnpm exec vitest run broker/tests --exclude "broker/tests/deploy-smoke/**"

  native-overlay:
    name: Overlay
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup UV environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-args: --extra dev
          lock-mode: locked

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"

      - name: Configure short Cargo target
        id: overlay-target
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ovt'
          $relative = [System.IO.Path]::GetRelativePath((Join-Path $PWD 'native/overlay'), $target)
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
          "relative-target=$relative" >> $env:GITHUB_OUTPUT

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v1-overlay-target
          workspaces: native/overlay -> ${{ steps.overlay-target.outputs.relative-target }}
          cache-targets: "true"

      - name: Cargo check
        run: cargo check --locked --manifest-path native/overlay/Cargo.toml

      - name: Cargo test deterministic
        run: cargo test --locked --manifest-path native/overlay/Cargo.toml -- --skip windows_graphics_

      - name: Assemble graphics test font resources
        run: |
          $fontDir = Join-Path $env:CARGO_TARGET_DIR 'debug/deps/puripuly_heart/data/fonts'
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          Copy-Item -LiteralPath 'src/puripuly_heart/data/fonts/NotoSansCJK-Medium.ttc' -Destination $fontDir -Force

      - name: Cargo test graphics
        run: cargo test --locked --manifest-path native/overlay/Cargo.toml windows_graphics_ -- --test-threads=1

      - name: Run overlay integration tests
        env:
          INTEGRATION: "1"
          PYTHONIOENCODING: utf-8
        run: >
          uv run --locked pytest -ra
          tests/app/test_desktop_overlay_runner.py::test_import_run_desktop_overlay_dispatch_is_provider_secret_and_stt_free
          tests/app/test_desktop_overlay_runner.py::test_import_preview_dispatch_is_provider_secret_and_stt_free
          tests/core/runtime/test_overlay_runtime.py::test_overlay_runtime_receives_real_subprocess_shutdown_ack_before_reader_cleanup
          tests/ui/test_flet_desktop_view_process_owner.py::test_windows_kill_on_close_job_reaps_assigned_real_process
          tests/ui/test_flet_desktop_view_process_owner.py::test_owner_reaps_real_process_and_pid_file_across_ten_cycles
          --junitxml=overlay-integration-results.xml

      - name: Require five integration results with no skips
        if: always()
        shell: bash
        run: |
          uv run --locked python -c "import xml.etree.ElementTree as ET; s=ET.parse('overlay-integration-results.xml').getroot().find('testsuite'); c={k: int(s.get(k, '0')) for k in ('tests', 'skipped', 'failures', 'errors')}; print(c); assert c == {'tests': 5, 'skipped': 0, 'failures': 0, 'errors': 0}, c"

      - name: Upload overlay integration results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: overlay-integration-results
          path: overlay-integration-results.xml
