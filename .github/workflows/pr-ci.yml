name: PR CI

on:
  pull_request:
    branches:
      - dev
      - release

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14.7"
  UV_VERSION: "0.9.17"
  NODE_VERSION: "22"

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-style:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup UV environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-args: --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Black check
        run: uv run black --check .

  python-contracts:
    name: Contracts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup UV environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-args: --extra dev

      - name: Run contract tests
        run: uv run pytest tests/domain tests/config tests/core

  python-suite:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Architecture
            pytest-args: tests/architecture
          - name: Runtime
            pytest-args: tests/app
          - name: Providers
            pytest-args: tests/providers
          - name: UI
            pytest-args: tests/ui
          - name: Tooling
            pytest-args: tests/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup UV environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-args: --extra dev

      - name: Run tests
        run: uv run pytest ${{ matrix.pytest-args }}

  broker-ci:
    name: Broker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run broker tests
        run: pnpm exec vitest run broker/tests --exclude "broker/tests/deploy-smoke/**"

  native-overlay:
    name: Overlay
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup UV environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          sync-args: --extra dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/overlay
          cache-targets: "false"

      - name: Cargo check
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ovt
        run: cargo check --locked --manifest-path native/overlay/Cargo.toml

      - name: Cargo test deterministic
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ovt
        run: cargo test --locked --manifest-path native/overlay/Cargo.toml -- --skip windows_graphics_

      - name: Cargo test graphics
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ovt
        run: cargo test --locked --manifest-path native/overlay/Cargo.toml windows_graphics_ -- --test-threads=1

      - name: Run overlay integration tests
        env:
          INTEGRATION: "1"
          PYTHONIOENCODING: utf-8
        run: >
          uv run --frozen pytest
          tests/app/test_desktop_overlay_runner.py::test_import_run_desktop_overlay_dispatch_is_provider_secret_and_stt_free
          tests/app/test_desktop_overlay_runner.py::test_import_preview_dispatch_is_provider_secret_and_stt_free
          tests/core/runtime/test_overlay_runtime.py::test_overlay_runtime_receives_real_subprocess_shutdown_ack_before_reader_cleanup
          tests/ui/test_flet_desktop_view_process_owner.py::test_windows_kill_on_close_job_reaps_assigned_real_process
          tests/ui/test_flet_desktop_view_process_owner.py::test_owner_reaps_real_process_and_pid_file_across_ten_cycles
          --junitxml=overlay-integration-results.xml

      - name: Require five integration results with no skips
        shell: bash
        run: |
          uv run --frozen python -c "import xml.etree.ElementTree as ET; s=ET.parse('overlay-integration-results.xml').getroot().find('testsuite'); c={k: int(s.get(k, '0')) for k in ('tests', 'skipped', 'failures', 'errors')}; print(c); assert c == {'tests': 5, 'skipped': 0, 'failures': 0, 'errors': 0}, c"
