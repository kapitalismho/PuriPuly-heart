name: Setup UV Environment
description: Set up a pinned Python toolchain and sync the lockfile with uv.

inputs:
  python-version:
    description: Exact Python version to install.
    required: true
  uv-version:
    description: Exact uv version to install.
    required: true
  sync-args:
    description: Arguments to pass to uv sync before the lock enforcement flag.
    required: true
  lock-mode:
    description: Lock enforcement mode (frozen for release callers, locked for PR verification).
    default: frozen
  enable-cache:
    description: Persist uv dependency downloads between verification runs.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pinned uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
        cache-suffix: ${{ inputs.python-version }}
        cache-local-path: ${{ runner.temp }}/uv-cache
        prune-cache: "false"
        cache-python: "false"

    - name: Sync lockfile
      shell: bash
      run: uv sync ${{ inputs.sync-args }} --${{ inputs.lock-mode }}
