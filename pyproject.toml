[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puripuly-heart"
version = "2.9.1"
description = "LLM-based real-time translator for VRChat"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = [
  "LICENSE",
  "src/puripuly_heart/data/THIRD_PARTY_NOTICES.txt",
  "src/puripuly_heart/data/licenses/COPYING.LGPL-2.1.txt",
]
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0; platform_system == 'Windows'",
  "janus>=2.0",
  "cryptography==50.0.2",
  "python-osc==1.10.2",
  "zeroconf>=0.148.0,<1.0.0",
  "PyAudioWPatch; platform_system == 'Windows'",
  "proc-tap==1.1.1; platform_system == 'Windows' and platform_python_implementation == 'CPython' and python_version == '3.14' and platform_machine == 'AMD64'",
  "psutil>=5.9; platform_system == 'Windows' and platform_python_implementation == 'CPython' and python_version == '3.14' and platform_machine == 'AMD64'",
  "sounddevice==0.5.5",
  "onnxruntime==1.28.0",
  "google-genai>=2.21.0,<3.0.0",
  "elevenlabs>=2.60.0,<3.0.0",
  "websockets==16.1.1",
  "deepgram-sdk==7.8.1",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "keyring>=25.0",
  "flet==1.0.5",
  "flet-desktop==1.0.5",
  "httpx[socks]>=0.27",
  "httpx2[socks]>=2.16.0,<3",
  "truststore==0.10.4",
  "python-socks[asyncio]>=2.7.1,<3.0.0",
  "requests[socks]>=2.33.0,<3.0.0",
  "huggingface-hub==2.3.0",
  "hf-xet==1.7.0",
  "soxr==1.1.0",
]

[project.scripts]
puripuly = "puripuly_heart.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=1.3",
  "pytest-xdist==3.8.0",
  "pefile==2024.8.26",
  "PyYAML>=6.0.3,<7",
  "ruff>=0.6.0",
  "black>=26.10.1",
]
build = [
  "cmake>=3.31",
  "flet-cli==1.0.5",
  "libclang>=18.1",
  "pefile==2024.8.26",
  "scikit-build-core>=0.10",
  "nanobind>=2",
  "setuptools_scm[toml]>=6.2",
  "setuptools==84.2.1",
  "wheel==0.48.0",
]

[tool.uv]
constraint-dependencies = [
  "anyio>=4.14.2,<5",
  "certifi>=2026.10.19",
  "filelock>=3.20.3",
  "idna>=3.15",
  "jaraco-context>=6.1.0",
  "oauthlib>=4.0.0,<5",
  "pillow>=13.0.0",
  "protobuf>=6.33.5,<7",
  "pyasn1>=0.6.4",
  "pydantic>=2.14.1,<3",
  "pygments>=2.20.0",
  "urllib3>=2.8.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -s"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py314"]
force-exclude = "build\\.spec"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501", "E701"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
puripuly_heart = ["data/**/*"]
