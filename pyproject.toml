[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "puripuly-heart"
version = "2.4.0"
description = "LLM-based real-time translator for VRChat"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = [
  "LICENSE",
  "src/puripuly_heart/data/THIRD_PARTY_NOTICES.txt",
  "src/puripuly_heart/data/licenses/COPYING.LGPL-2.1.txt",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.1",
  "janus>=2.0",
  "cryptography==46.0.7",
  "python-osc==1.10.2",
  "zeroconf>=0.148.0,<1.0.0",
  "PyAudioWPatch; platform_system == 'Windows'",
  "proc-tap==1.1.1; platform_system == 'Windows' and platform_python_implementation == 'CPython' and python_version == '3.12' and platform_machine == 'AMD64'",
  "psutil>=5.9; platform_system == 'Windows' and platform_python_implementation == 'CPython' and python_version == '3.12' and platform_machine == 'AMD64'",
  "sounddevice==0.5.5",
  "onnxruntime==1.28.0",
  "google-genai>=2.16.0,<3.0.0",
  "dashscope==1.26.4",
  "websockets>=16.1.1,<17.0.0",
  "deepgram-sdk>=5.3.4,<6.0.0",
  "sherpa-onnx>=1.13.4",
  "sherpa-onnx-core==1.13.4",
  "keyring>=25.0",
  "flet==0.86.1",
  "flet-desktop==0.86.1",
  "httpx>=0.27",
  "huggingface-hub==1.26.0",
  "hf-xet==1.5.2",
  "soxr==1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.6.0",
  "black>=24.4.0",
  "pre-commit>=3.7.0",
]
build = [
  "cmake>=3.31",
  "flet-cli==0.86.1",
  "libclang>=18.1",
  "pyinstaller>=6.0",
  "scikit-build-core>=0.10",
  "nanobind>=2",
  "setuptools_scm[toml]>=6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -s"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]
force-exclude = "build\\.spec"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501", "E701"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
puripuly_heart = ["data/**/*"]
