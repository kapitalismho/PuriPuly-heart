[package]
name = "puripuly-heart-gpu-worker"
version = "2.3.2"
edition = "2021"
license = "AGPL-3.0-or-later"
build = "build.rs"

[lib]
name = "puripuly_heart_gpu_worker"
path = "src/lib.rs"

[[bin]]
name = "PuriPulyHeartGpuWorker"
path = "src/main.rs"

[dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["vulkan"] }

[dev-dependencies]
tempfile = "3"
